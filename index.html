<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13212F">
<title>EV log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <section class="view" id="v-helm"></section>
  <section class="view" id="v-tripend"></section>
  <section class="view" id="v-predip"></section>
  <section class="view" id="v-trips"></section>
  <section class="view" id="v-trip"></section>
  <section class="view" id="v-tripform"></section>
  <section class="view" id="v-curve"></section>
  <section class="view" id="v-tanks"></section>
  <section class="view" id="v-refuel"></section>
  <section class="view" id="v-range"></section>
  <section class="view" id="v-log"></section>
  <section class="view" id="v-more"></section>
</div>

<nav id="nav" aria-label="Main">
  <button data-go="helm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="m12 7 3 8-3-2-3 2 3-8Z"/></svg>Drive</button>
    <button data-go="trips"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>Drives</button>
  <button data-go="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h4"/></svg>Log</button>
  <button data-go="curve"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M6 16c3-1 4-6 7-7s4 3 7 2"/></svg>Consumption</button>
  <button data-go="tanks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 10v4M7 10v4M11 10v4"/></svg>Battery</button>
  <button data-go="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>More</button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet"><div class="panel" id="sheet-panel"></div></div>

<script src="leaflet.js"></script>
<script>if (!window.L) { document.write('<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>'); }</script>
<script src="i18n.js"></script>
<script src="core.js"></script>
<script src="wind.js"></script>
<script src="app.js"></script>
</body>
</html>
